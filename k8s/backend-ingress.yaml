apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user105-back-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 프론트 Ingress와 동일 → ALB 1개를 공유
    alb.ingress.kubernetes.io/group.name: user105-app
    # 프론트(/, order 100)보다 먼저 매칭되도록 낮은 값
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # 백엔드 헬스체크 경로 (앱에 맞게 수정! 예: /api/health, /actuator/health)
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user105-back-service   # 백엔드 서비스 이름 (확인 필요)
                port:
                  number: 80                  # 백엔드 서비스 포트 (확인 필요)
